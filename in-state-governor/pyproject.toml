# SPDX-License-Identifier: Apache-2.0
[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "in-state-governor"
version = "0.1.0"
description = "Deterministic governance-compliance checker (mechanical core). Part of Governance Blueprint."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
keywords = ["governance", "compliance", "linter", "drift", "documentation"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Quality Assurance",
]
dependencies = []

[project.scripts]
governor = "governor.cli:main"

[tool.setuptools]
packages = ["governor"]
