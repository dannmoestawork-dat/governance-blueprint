[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "navigator"
version = "0.1.0"
description = "A sense-making companion dashboard: indexes a project tree, maps tool dependencies, runs gap analyzers, keeps plain-language living summaries, and recommends next steps."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
dependencies = [
    "textual>=1.0",
    "httpx>=0.27",
]

[project.scripts]
navigator = "navigator.cli:main"

[tool.setuptools.packages.find]
include = ["navigator*"]
